<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Literary bear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f3e6c9;
        --oak: #2c2416;
        --honey: #c7a44a;
        --moss: #4f6b4a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 700px at 50% -10%, #fff6dd, var(--cream) 50%, #e6d4a8);
        color: var(--oak);
        font-family: "Source Serif 4", Georgia, serif;
      }
      main { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
      h1 { font-family: Fraunces, Georgia, serif; font-size: 2.2rem; margin: 0 0 6px; }
      #status { opacity: 0.8; margin: 0 0 18px; }
      .stage {
        position: relative;
        background: #1a140c;
        border-radius: 18px;
        overflow: hidden;
        aspect-ratio: 1 / 0.96;
        box-shadow: 0 18px 40px rgba(44, 36, 22, 0.22);
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 280ms ease;
      }
      video.active { opacity: 1; }
      #sound {
        position: absolute; left: 16px; bottom: 16px; z-index: 2;
        border: 0; border-radius: 999px; padding: 8px 14px;
        background: var(--honey); color: var(--oak);
        font-family: Fraunces, Georgia, serif; cursor: pointer;
      }
      .card {
        margin-top: 16px;
        background: color-mix(in srgb, var(--cream) 80%, white);
        border: 1px solid color-mix(in srgb, var(--honey) 45%, var(--oak));
        border-radius: 14px;
        padding: 16px 18px;
      }
      .card h2 {
        font-family: Fraunces, Georgia, serif;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--moss);
        margin: 0 0 8px;
      }
      #script { margin: 0; line-height: 1.45; }
      .credit { margin-top: 16px; font-size: 0.85rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>A bear of very little news</h1>
      <p id="status">Waiting for the first clip…</p>
      <div class="stage">
        <video id="a" playsinline muted></video>
        <video id="b" playsinline muted></video>
        <button id="sound" type="button">Tap for sound</button>
      </div>
      <section class="card">
        <h2>Now speaking</h2>
        <p id="headline" style="font-family: Fraunces, Georgia, serif; font-size: 1.15rem; margin: 0 0 8px;"></p>
        <p id="script"></p>
      </section>
      <p class="credit">E. H. Shepard, 1926. U.S. public domain. Not Disney. Powered by Anchorcast.</p>
    </main>
    <script>
      const players = [document.getElementById("a"), document.getElementById("b")];
      let active = 0;
      let playingIndex = -1;
      let clips = [];
      let waiting = false;
      let wantSound = false;
      let bufferTarget = 2;

      function clipAt(index) {
        return clips.find((clip) => clip.index === index);
      }

      function heartbeat() {
        if (playingIndex < 0) return;
        fetch("/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playing_index: playingIndex }),
        }).catch(() => {});
      }

      async function refresh() {
        const state = await fetch("/api/state").then((r) => r.json());
        clips = state.clips;
        bufferTarget = state.buffer_target || 2;
        const ready = clips.length >= bufferTarget;
        document.getElementById("status").textContent = ready
          ? `${state.clips.length} clips · buffer ${state.buffer_ahead}/${bufferTarget}` +
            (state.generating ? " · generating…" : " · live")
          : `Warming — waiting for ${bufferTarget} clips before playing` +
            (state.generating ? " · generating…" : "");
        if (playingIndex < 0 && ready) {
          const start = clips[Math.max(0, clips.length - bufferTarget)].index;
          startClip(start);
        }
        if (playingIndex >= 0) preload(playingIndex + 1);
        if (waiting && clipAt(playingIndex + 1)) {
          waiting = false;
          playNext();
        }
        heartbeat();
      }

      function startClip(index) {
        const clip = clipAt(index);
        if (!clip) return;
        playingIndex = index;
        waiting = false;
        const player = players[active];
        if (!player.src.endsWith(clip.url)) player.src = clip.url;
        player.classList.add("active");
        players[1 - active].classList.remove("active");
        player.muted = !wantSound;
        player.play().catch(() => {});
        document.getElementById("headline").textContent = clip.topic;
        document.getElementById("script").textContent = clip.script;
        preload(index + 1);
        heartbeat();
      }

      function playNext() {
        const next = playingIndex + 1;
        if (!clipAt(next)) {
          waiting = true;
          document.getElementById("status").textContent = "Waiting for the next clip…";
          return;
        }
        active = 1 - active;
        startClip(next);
      }

      function preload(index) {
        const clip = clipAt(index);
        if (!clip) return;
        const standby = players[1 - active];
        if (standby.src.endsWith(clip.url)) return;
        standby.src = clip.url;
        standby.load();
      }

      document.getElementById("sound").addEventListener("click", () => {
        wantSound = true;
        players.forEach((player) => { player.muted = false; });
        document.getElementById("sound").hidden = true;
      });

      players.forEach((player) => {
        player.addEventListener("ended", () => {
          if (player !== players[active]) return;
          playNext();
        });
        player.addEventListener("timeupdate", () => {
          if (player !== players[active] || !player.duration) return;
          if (player.duration - player.currentTime < 8) preload(playingIndex + 1);
        });
      });

      refresh();
      setInterval(refresh, 600);
    </script>
  </body>
</html>
