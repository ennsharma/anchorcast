[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchorcast"
version = "0.1.0"
description = "A Python client for real-time media streams generated by pluggable models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nikhil Sharma" }]
keywords = ["livestream", "generative-video", "fal", "h3-max"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = [
  "fal-client>=0.5.0",
  "feedparser>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ennsharma/anchorcast"
Repository = "https://github.com/ennsharma/anchorcast"
Issues = "https://github.com/ennsharma/anchorcast/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
