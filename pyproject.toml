[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchorcast"
version = "0.1.0"
description = "A client for real-time media streams generated by pluggable models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fal-client>=0.5.0",
  "feedparser>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
